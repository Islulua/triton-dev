[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "triton-dev"
version = "0.2.0"
description = "SDK environments and evidence-driven developer workflows"
requires-python = ">=3.10"
dependencies = ["packaging>=24"]

[project.optional-dependencies]
server = ["pytest>=8", "pytest-xdist>=3.6", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cryptography>=43", "psycopg[binary]>=3.2,<4"]
test = ["pytest>=8", "pytest-xdist>=3.6", "build>=1.2", "ruff>=0.11", "sqlalchemy>=2,<3", "alembic>=1.13,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "cryptography>=43", "psycopg[binary]>=3.2,<4", "httpx>=0.27"]

[project.scripts]
triton-dev = "triton_dev.cli:entrypoint"
triton-env = "triton_dev.cli:legacy_entrypoint"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["triton_dev*"]
exclude = ["*.tests", "*.tests.*"]

[tool.pytest.ini_options]
testpaths = ["triton_dev", "tests"]
addopts = "-ra --strict-markers --import-mode=importlib"
markers = [
  "sdk_integration: requires actual SDK packages and native runtime",
  "nightly: requires remote daily SDK and execution resources",
  "live_ai: requires explicitly configured live AI credentials",
]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
