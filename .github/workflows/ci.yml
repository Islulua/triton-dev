name: offline-ci
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install shell test dependency
        run: sudo apt-get update && sudo apt-get install -y zsh
      - name: Install tool and test dependencies
        run: python -m pip install -e '.[test]'
      - name: Lint
        run: ruff check .
      - name: Offline interface and workflow tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Build distributions
        run: python -m build
      - name: Validate installed wheel away from source checkout
        shell: bash
        run: |
          python -m venv "$RUNNER_TEMP/wheel-smoke"
          python -m pip download 'packaging>=24' --dest "$RUNNER_TEMP/offline-wheels"
          "$RUNNER_TEMP/wheel-smoke/bin/python" -m pip install --no-index --find-links "$RUNNER_TEMP/offline-wheels" dist/*.whl
          test_python="$(command -v python)"
          smoke_script="$PWD/examples/wheel_smoke.py"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/wheel-smoke/bin/triton-dev" capabilities --json --non-interactive
          "$RUNNER_TEMP/wheel-smoke/bin/triton-dev" describe env.export --json --non-interactive
          "$RUNNER_TEMP/wheel-smoke/bin/triton-dev" doctor --json
          "$RUNNER_TEMP/wheel-smoke/bin/python" "$smoke_script" --test-python "$test_python"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-results-py${{ matrix.python }}
          path: |
            test-results.xml
            dist/*
